services:
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.timeline.TimelineService
  - class: org.yamcs.archive.XtceTmRecorder
  
  - class: org.yamcs.parameter.SystemParametersService
    args:
      provideJvmVariables: true
      provideFsVariables: true

  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  
  
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
      backFiller:
        enabled: false
        warmupTime: 60
  
  - class: org.yamcs.cfdp.CfdpService
    name: cfdp
    args:
     inactivityTimeout: 30000
     sequenceNrLength: 4
     maxPduSize: 2048
     incomingBucket: groundstation
     allowRemoteProvidedBucket: false
     allowRemoteProvidedSubdirectory: false
     allowDownloadOverwrites: false
     automaticDirectoryListingReloads: true
     maxExistingFileRenames: 1000
     eofAckTimeout: 3000
     eofAckLimit: 5
     sleepBetweenPdus: 1000
     maxNumPendingUploads: 1
     localEntities:
       - name: groundstation
         id: 10
         bucket: groundstation
     remoteEntities:
       - name: satellite
         id: 20
     senderFaultHandlers:
       AckLimitReached: suspend
     fileListingParserClassName: org.yamcs.filetransfer.CsvListingParser
     fileListingParserArgs:
       timestampMultiplier: 1

dataLinks:
  # AX.25 Beacon telemetry channel
  - name: tm_beacon
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tmr_beacon
    port: 10015 # GS-Modem beacon telemetry port
    invalidPackets: DIVERT
    invalidPacketsStream: invalid_tm_stream
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      packetSize: 269
      seqCountOffset: -1
      timestampOffset: -1


  - name: tm_edl
    class: org.yamcs.tctm.ccsds.UdpTmFrameLink
    errorDetection: CRC16
    port: 10016 # GS-Modem USLP telemetry port
    frameType: USLP # Process all TM with USLP header
    spacecraftId: 0x4F53 # "OS" in ASCII
    badFrameStream: invalid_tm_stream # Process unrecognized TM here
    minFrameLength: 14 # 7 + 4 + 1 + 2. Needed so that insert zone doesn't throw an error.
    maxFrameLength: 65535 # Global max packet-size 2^16 B
    insertZoneLength: 4
    virtualChannels:
      # EDL Virtual Channel
      - vcId: 0
        service: VCA # tells yamcs to use a custom handler instead of the default space/encaps packets handler.
        stream: tmr_edl
        vcaHandlerClassName: org.uniclogs.yamcs.tctm.VcEdlDownlinkHandler
        packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
        packetPreprocessorArgs: # while it appears that this does nothing, this is required by yamcs.
          timestampOffset: -1 # If the edl is changed to have sequence numbers outside the insert zone, these
          seqCountOffset: -1 # should be handled by the preprocessor with these configuration flags.
          errorDetection:
            type: "NONE"  # the crc is already checked as part of the USLP frame. Because the edl uses uslp
                          # frames as packets, edl processing does not need to check this.

      # CFDP Virtual Channel
      - vcId: 1
        ocfPresent: false
        service: PACKET
        maxPacketLength: 2048
        stream: cfdp_in
        stripEncapsulationHeader: true
        packetPreprocessorClassName: org.yamcs.tctm.IssPacketPreprocessor
        packetPreprocessorArgs:
          packetSize: 65000 # TODO: set this to the max CFDP in USLP packet size

  - name: tc_edl
    class: org.yamcs.tctm.ccsds.UdpTcFrameLink
    errorDetection: CRC16
    priorityScheme: ABSOLUTE
    host: localhost # GS-Modem Address
    frameType: USLP # Process all TM with USLP header
    port: 10025 # GS-Modem USLP telecommand port
    spacecraftId: 0x4F53 # "OS" in ASCII
    maxFrameLength: 65535 # Global max packet-size 4 kb
    insertZoneLength: 4

    virtualChannels:
    # EDL Virtual Channel
    - vcId: 0
      service: PACKET
      priority: 0
      maxPacketLength: 65000 # TODO: set this to the max EDL in USLP packet size
      stream: tcr_edl 
      # commandPostprocessorClassName: org.yamcs.tctm.IssCommandPostprocessor
      # commandPostprocessorArgs:
      #   errorDetection:
      #     type: "CRC-16-CCIIT"
      #   enforceEvenNumberOfBytes: true

    # CFDP Virtual Channel
    - vcId: 1
      service: PACKET
      priority: 0
      maxPacketLength: 65000 # TODO: set this to the max CFDP in USLP packet size
      stream: cfdp_out
      commandPostprocessorClassName: org.yamcs.tctm.IssCommandPostprocessor
      commandPostprocessorArgs:
        errorDetection:
          type: "CRC-16-CCIIT"
        enforceEvenNumberOfBytes: true

mdb:
  - type: xtce
    spec: mdb/oresat0_5.xtce

streamConfig:
  tm:
    - name: tmr_beacon
      rootContainer: /oresat0_5/beacon
    
    - name: tmr_edl
      processor: realtime
      rootContainer: /oresat0_5/edl_responses
    
    - name: tmd_debug

    - name: cfdp_in
      processor: realtime
  
  tc:
    - name: tcr_edl
      rootContainer: /oresat0_5/edl_responses
      processor: realtime

    - name: cfdp_out
      processor: realtime

  cmdHist: 
    - cmdhist_realtime
    - cmdhist_dump

  event: 
    - events_realtime
    - events_dump

  param:
    - pp_realtime
    - sys_param
    - proc_param

  invalidTm: invalid_tm_stream
  parameterAlarm: [ alarms_realtime ]
  eventAlarm: [ event_alarms_realtime ]
  #sqlFile: etc/extra_streams.sql